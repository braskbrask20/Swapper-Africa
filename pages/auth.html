<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Account | Swapper Africa</title><link rel="icon" type="image/svg+xml" href="../images/favicon.svg"><meta name="theme-color" content="#0c6b45"><link rel="stylesheet" href="../css/style.css"></head><body class="admin-body"><a class="skip-link" href="#main">Skip to main content</a><main id="main" class="admin-login"><a class="brand" href="../index.html"><span class="brand-mark">S</span>Swapper Africa</a><section id="authSection" class="content-card"><p class="eyebrow">Your account</p><h1 id="authTitle">Welcome back</h1><p id="authDescription" class="helper-text">Sign in to manage your swaps securely.</p><form id="authForm" class="admin-form"><label id="nameField" hidden>Full name<input id="fullName" type="text" autocomplete="name" minlength="2"></label><label id="emailField">Email<input id="email" type="email" autocomplete="email" required></label><label id="passwordField">Password<input id="password" type="password" autocomplete="current-password" minlength="12" required></label><button id="authSubmit" class="button button-primary" type="submit">Sign in <span>→</span></button><p id="authMessage" class="form-message" aria-live="polite"></p><p id="devHint" class="helper-text" hidden></p></form><div class="auth-links"><button id="forgotPassword" class="text-link auth-mode" type="button">Forgot password?</button><button id="authMode" class="text-link auth-mode" type="button">New to Swapper Africa? Create an account</button></div></section><section id="verifySection" class="content-card" hidden><p class="eyebrow">Email verification</p><h1 id="verifyTitle">Verifying your email…</h1><p id="verifyDescription" class="helper-text">One moment.</p><a href="dashboard.html" class="button button-primary">Go to dashboard <span>→</span></a></section></main><script src="../js/api.js"></script><script src="../js/auth.js"></script></body></html>
