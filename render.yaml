# Render Blueprint: describes the whole deployment (web service + database) so it can be
# provisioned in one pass via Render's dashboard: New + -> Blueprint -> select this repo.
#
# Render's Blueprint schema has changed over time, so if a field here doesn't parse, check it
# against Render's current Blueprint docs -- worst case, use the manual dashboard steps in
# README.md's "Deploy to Render" section instead; nothing here is required to deploy.
services:
  - type: web
    name: swapper-africa
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://swapper-africa.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: swapper-africa-db
          property: connectionString

databases:
  - name: swapper-africa-db
    plan: free
